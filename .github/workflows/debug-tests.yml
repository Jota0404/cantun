name: Temporary Test Diagnostics

on:
  push:
    branches:
      - feature/song-detail

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests and capture output
        shell: bash
        run: |
          set +e
          npm test -- --reporter=verbose > test-output.txt 2>&1
          status=$?
          echo "TEST_EXIT_CODE=$status" >> test-output.txt
          exit $status

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cantun-test-diagnostics
          path: test-output.txt
