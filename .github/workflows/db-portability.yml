name: DB (PostgreSQL)

# Recria o schema do zero em PostgreSQL 16 padrão a partir de db/migrations,
# confere a idempotência do runner e roda os testes SQL de db/tests (ADR-059).
# Bloqueante: um PR que quebre o schema ou o isolamento não passa.

on:
  push:
    branches:
      - main
    paths:
      - 'db/**'
      - 'scripts/db/**'
      - '.github/workflows/db-portability.yml'
  pull_request:
    paths:
      - 'db/**'
      - 'scripts/db/**'
      - '.github/workflows/db-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply migrations and run SQL tests
        run: ./scripts/db/verify-migrations.sh
