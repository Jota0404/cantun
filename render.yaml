# CANTUM no Render (ADR-060). Roteiro passo a passo: docs/OPERATIONS.md.
# Um web service gratuito serve o front (dist/) e a API na mesma origem *.onrender.com.
services:
  - type: web
    name: cantum
    runtime: node
    plan: free
    region: virginia
    healthCheckPath: /health
    # NODE_ENV=production vale também no build: --include=dev traz Vite e TypeScript.
    # O front chama a API na própria URL do serviço (RENDER_EXTERNAL_URL, definida pelo Render).
    buildCommand: >-
      npm ci --include=dev &&
      export VITE_API_URL="${VITE_API_URL:-$RENDER_EXTERNAL_URL}" &&
      test -n "$VITE_API_URL" &&
      npm run build &&
      npm ci --prefix server --omit=dev
    # Aplica as migrations pendentes (sem psql) e sobe o servidor.
    startCommand: >-
      cd server &&
      export APP_ORIGIN="${APP_ORIGIN:-$RENDER_EXTERNAL_URL}" &&
      node src/migrate.ts &&
      exec node src/index.ts
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Saltos de proxy na frente do servidor (o do Render). Confira no primeiro deploy:
      # docs/OPERATIONS.md, seção 5.
      - key: TRUST_PROXY
        value: "1"
      # Secretas: o Render pede o valor na criação; nunca vão para o Git (ADR-050).
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
