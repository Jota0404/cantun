<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CANTUM</title>
    <script>
      // Tema antes do primeiro render, sem piscar. A chave e a regra (escuro por padrão) são as de src/theme.ts.
      try { document.documentElement.dataset.theme = localStorage.getItem('cantum-theme') === 'light' ? 'light' : 'dark' } catch { document.documentElement.dataset.theme = 'dark' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
